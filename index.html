<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estimate project man-days across phases, features, tasks, and roles."
    />
    <title>Man-Day Estimator</title>
  </head>
  <body>
    <script>
      // Applied before first paint so a dark-theme user never sees a white
      // flash while the bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem('manday-estimator-theme-v1')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
